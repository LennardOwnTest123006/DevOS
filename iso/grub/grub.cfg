set default=0
set timeout=6
set timeout_style=menu

insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "DevOS - start (live, nothing is written to your disks)" {
    linux /casper/vmlinuz boot=casper quiet loglevel=3 username=dev hostname=devos userfullname=Developer noprompt ---
    initrd /casper/initrd
}
menuentry "DevOS - German keyboard (Deutsch)" {
    linux /casper/vmlinuz boot=casper quiet loglevel=3 username=dev hostname=devos userfullname=Developer devos.kb=de keyboard-configuration/layoutcode=de locale=de_DE noprompt ---
    initrd /casper/initrd
}
menuentry "DevOS - safe graphics (if the screen stays black)" {
    linux /casper/vmlinuz boot=casper nomodeset username=dev hostname=devos userfullname=Developer noprompt ---
    initrd /casper/initrd
}
menuentry "DevOS - load fully into RAM (you can remove the USB stick afterwards)" {
    linux /casper/vmlinuz boot=casper toram quiet loglevel=3 username=dev hostname=devos userfullname=Developer noprompt ---
    initrd /casper/initrd
}
menuentry "DevOS - with persistence (needs a partition labeled casper-rw)" {
    linux /casper/vmlinuz boot=casper persistent quiet loglevel=3 username=dev hostname=devos userfullname=Developer noprompt ---
    initrd /casper/initrd
}
menuentry "Reboot into firmware setup (boot menu - go back to Windows / Linux)" {
    fwsetup
}
menuentry "Power off" {
    halt
}
